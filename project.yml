# XcodeGen spec — a fallback / regeneration path for the Xcode project.
# If the committed RunForrestRun.xcodeproj ever gets out of sync, install
# XcodeGen (`brew install xcodegen`) and run `xcodegen generate`.
name: RunForrestRun
options:
  bundleIdPrefix: com.runforrestrun
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RunForrestRun:
    type: application
    platform: iOS
    sources:
      - path: RunForrestRun
    settings:
      base:
        INFOPLIST_FILE: RunForrestRun/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.runforrestrun.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
